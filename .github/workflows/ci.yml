name: CI

# Every row runs on every event. No branch or path filters: a filter that skips
# a job makes `ci-passed` succeed without it, which is the same as not having it.
on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

# Keyed by an identity that is stable for the event, so a rerun of the same PR,
# merge group, or ref cancels its predecessor and nothing else. This cannot
# cancel a differently named merge group and does not claim to.
#
# On `main` the key carries the commit as well, so every push gets a group of
# its own. Superseding a branch run costs nothing -- the answer wanted is about
# the tip -- but on `main` the question is "what did this commit's gate say",
# and there are two ways to lose the answer. Exempting `main` from
# `cancel-in-progress` stops a *running* verdict being superseded; three `main`
# runs were cancelled that way. It does not stop a *pending* one being discarded
# when the next push joins the group, which is what cost `531af7b` its verdict:
# cancelled with zero jobs ever started, one second after the following push.
# The per-commit key removes both; the exemption stays as a fallback for a group
# ever reached twice at one commit.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      github.event.pull_request.number
      || github.event.merge_group.head_ref
      || github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # The exact nightly the fuzz lane was planned against.
  FUZZ_TOOLCHAIN: nightly-2026-08-20
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Root package
        run: cargo fmt --check
      - name: Independent workspaces
        run: |
          cargo fmt --manifest-path validation/zlib-rs-arm/Cargo.toml --check
          cargo fmt --manifest-path validation/c-zlib-arm/Cargo.toml --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check
      # Sources no manifest owns. `cargo fmt` walks targets, so a file that is
      # `include!`d by a generated consumer is reached by no manifest here and
      # would go unformatted forever.
      - name: Sources outside every manifest
        run: |
          rustfmt --edition 2021 --check validation/shared/scenarios.rs
          rustfmt --edition 2021 --check validation/consumer-matrix/public_api.rs

  clippy:
    name: clippy (${{ matrix.axis }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # None of the three replaces another; Cargo.toml's [lints.clippy]
        # comment says why.
        axis: [default, all-targets, all-features]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `-D warnings` on the command line, not a manifest level: a warn-level
      # lint prints and still exits 0, so exit code alone is not zero findings.
      # The axis names a whole command: expanding a flags variable into the
      # shell would be both a template injection and an unquoted split.
      - name: Clippy
        env:
          AXIS: ${{ matrix.axis }}
        run: |
          case "$AXIS" in
            default)      cargo clippy --locked -- -D warnings ;;
            all-targets)  cargo clippy --locked --all-targets -- -D warnings ;;
            all-features) cargo clippy --locked --all-features -- -D warnings ;;
            *) echo "::error::unknown clippy axis: $AXIS" >&2; exit 1 ;;
          esac

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `--all-targets` is not a substitute: it excludes doctests, and ten of
      # this crate's fifteen import sites are doctest lines under src/.
      - name: Test
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked --no-fail-fast

  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A plain `cargo doc` exits 0 on warnings, so the flags are the gate.
      - name: Document
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links
        run: cargo doc --locked --no-deps

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exact, not a range: this proves the `rust-version` the manifest declares,
      # which compiling on current stable does not.
      - name: Rust 1.85.0
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup default 1.85.0
      - name: Test on the declared minimum
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked --no-fail-fast

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package
        env:
          RUSTFLAGS: -D warnings
        run: cargo package --locked --all-features
      # `exclude` fails silently -- a name it cannot drop produces no warning --
      # so the archive is inspected rather than the manifest trusted.
      - name: The archive ships neither development tree
        run: |
          listing=$(cargo package --locked --list)
          printf '%s\n' "$listing"
          for unwanted in .github/ fuzz/ validation/ AGENTS.md CLAUDE.md CONTRIBUTING.md .semgrepignore; do
            if printf '%s\n' "$listing" | grep -q "^${unwanted}"; then
              echo "::error::${unwanted} is in the published archive" >&2
              exit 1
            fi
          done
          for required in README.md LICENSE; do
            if ! printf '%s\n' "$listing" | grep -qx "${required}"; then
              echo "::error::${required} is missing from the published archive" >&2
              exit 1
            fi
          done

  backend:
    name: backend (${{ matrix.arm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One runner and target dir each. Built together, Cargo unions the
        # features and both arms get the C backend.
        include:
          - arm: zlib-rs
            manifest: validation/zlib-rs-arm/Cargo.toml
          - arm: c-zlib
            manifest: validation/c-zlib-arm/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clippy
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: cargo clippy --locked --all-targets --manifest-path "$MANIFEST" -- -D warnings
      - name: Test
        env:
          MANIFEST: ${{ matrix.manifest }}
          RUSTFLAGS: -D warnings
        run: cargo test --locked --no-fail-fast --manifest-path "$MANIFEST"

  consumer-matrix:
    name: consumer-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Seven external feature graphs against the packaged crate
        env:
          RUSTFLAGS: -D warnings
        run: ./validation/consumer-matrix/run.sh

  fuzz-lint:
    name: fuzz-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.FUZZ_TOOLCHAIN }}
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal \
            --component clippy,rustfmt --no-self-update
          rustup default "$FUZZ_TOOLCHAIN"
      # A fuzz target is repository code. Living in an independent workspace is
      # not a warning exemption.
      - name: Format
        run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      # `--locked` because `fuzz/Cargo.lock` is tracked: without it a stale or
      # broken lockfile re-resolves quietly instead of failing the job.
      - name: Clippy
        run: >-
          cargo clippy --locked --manifest-path fuzz/Cargo.toml
          --all-targets --all-features -- -D warnings
      # `clippy --all-targets` compiles the corpus assertions without running
      # them, which would leave the thing that proves the corpus is not vacuous
      # unexecuted -- the defect it exists to catch, one level up. This job is
      # where it belongs rather than beside `fuzz`, because the matrix already
      # declares `needs: [fuzz-lint]`, so a rotten corpus stops the expensive
      # rows instead of running next to them.
      #
      # One named backend, deliberately not the `--all-features` of the step
      # above. Both features together forward `flate2/zlib-rs` *and*
      # `flate2/zlib`, and nothing in this tree then decides which is live --
      # flate2's own precedence does. The comment above the feature table exists
      # to stop exactly that. Every assertion here was run under `zlib-rs`
      # alone, `zlib` alone, and both, with identical results, so the flag is
      # not load-bearing today; it is what it licenses once anything under
      # `fuzz/tests/` touches the codec.
      #
      # Not narrowed with `--test corpus` either: a target-scoped recipe stops
      # running a second test target the day someone adds one.
      - name: Corpus assertions
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo test --locked --manifest-path fuzz/Cargo.toml --features zlib-rs

  fuzz:
    name: fuzz (${{ matrix.target }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [fuzz-lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server_accept
            backend: zlib-rs
          - target: client_finish
            backend: zlib-rs
          - target: decoder
            backend: zlib-rs
          # The decoder is the only target whose behaviour is backend-dependent,
          # so it is the only one that earns a second leg.
          - target: decoder
            backend: zlib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.FUZZ_TOOLCHAIN }}
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$FUZZ_TOOLCHAIN"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "${CARGO_FUZZ_VERSION}"
      # A five-minute smoke run per leg, not a claim of exhaustive fuzzing.
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          BACKEND: ${{ matrix.backend }}
        run: |
          cargo fuzz run "$TARGET" --fuzz-dir fuzz \
            --no-default-features --features "$BACKEND" -- \
            -max_total_time=300 -max_len=65536 -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix="fuzz/artifacts/$TARGET/"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}-${{ matrix.backend }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location -o actionlint.tar.gz "$url"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version
      # No -ignore expressions. Ubuntu ships ShellCheck on PATH, so `run:` bodies
      # are checked too.
      - name: Lint
        run: ./actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Console mode, not SARIF: SARIF/Advanced Security mode does not fail on
      # findings. `pedantic`, not `auditor` -- auditor deliberately emits likely
      # false positives, which cannot carry a zero-finding policy.
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: v1.29.0
          persona: pedantic
          advanced-security: false
          online-audits: true
          fail-on-no-inputs: true

  opengrep:
    name: opengrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pinned rule pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amplify-security/opengrep-rules
          ref: e7643a008ec9027c96dfef7bdf5aedcac3847da8
          path: .opengrep-rules
          persist-credentials: false
      - name: Install OpenGrep 1.28.0
        env:
          OPENGREP_VERSION: v1.28.0
          OPENGREP_SHA256: 85af2f34e5175995acbc431e1ca733e34062aad9640ad4308422abe1968b84cf
        run: |
          url="https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          curl --fail --silent --show-error --location -o opengrep "$url"
          echo "${OPENGREP_SHA256}  opengrep" | sha256sum --check --strict
          chmod +x opengrep
          ./opengrep --version
      # Qualification before the scan. A clean result from an engine that parsed
      # no rules is indistinguishable from a clean codebase, so the pack is
      # counted and then proved to fire before its silence is believed.
      - name: Qualify the rule pack
        env:
          KNOWN_POSITIVE: opengrep-rules.rust.lang.security.unsafe-usage
        run: |
          rules=.opengrep-rules/rust/lang/security
          count=$(find "$rules" -name '*.yml' | wc -l)
          echo "rule files: $count"
          if [ "$count" -ne 10 ]; then
            echo "::error::expected 10 pinned Rust security rules, found $count" >&2
            exit 1
          fi
          # The pack ships a deliberately vulnerable fixture beside each rule.
          # Scanning one and requiring its own rule ID back is the known-positive:
          # it fails both when the rules do not parse and when they parse but
          # match nothing. No --error here -- a finding is the expected result.
          ./opengrep scan --strict --json --config "$rules" \
            "$rules/unsafe-usage.rs" > qualify.json
          # Printed on success too. A qualification that only speaks when it
          # fails records nothing on the run that is supposed to carry the
          # evidence.
          jq '{reported_ids: [.results[].check_id], parser_errors: .errors,
               skipped_rules: .skipped_rules}' qualify.json
          # The full namespaced ID, read out of results[]. A substring test for
          # `unsafe-usage` also matches paths.scanned, which names the fixture
          # whether or not the rule fired, so it would pass on zero findings.
          if ! jq --exit-status --arg id "$KNOWN_POSITIVE" \
               '.errors == [] and .skipped_rules == []
                and ([.results[].check_id] | index($id) != null)' \
               qualify.json > /dev/null; then
            echo "::error::the pinned pack did not parse cleanly and report $KNOWN_POSITIVE on its own fixture" >&2
            exit 1
          fi
      # --error and --strict make findings and malformed rules a failure.
      # --disable-nosem makes suppressed findings visible.
      #
      # The population is asserted rather than assumed, because this step
      # reported clean over 15 of the crate's 20 Rust files: opengrep's built-in
      # ignore list drops every `tests/` directory, so `tests/` and
      # `validation/*/tests/` were named as roots here and never examined. The
      # root `.semgrepignore` replaces that list, and the comparison below is
      # what notices if anything leaves the population again. It is against
      # every tracked `.rs` in the tree rather than only these four roots, so a
      # Rust file added outside them fails here instead of going unscanned.
      #
      # No committed regression fixture is available for the pack's own rule:
      # `Cargo.toml` sets `unsafe_code = "forbid"`, so an `unsafe-usage` fixture
      # cannot live in this tree in any form. The pack's own fixture is the
      # known-positive and the qualify step above is where it runs.
      - name: Scan this crate's Rust roots
        run: |
          status=0
          ./opengrep scan --error --strict --disable-nosem \
            --config .opengrep-rules/rust/lang/security \
            --json-output=scan.json \
            src tests validation fuzz || status=$?
          git ls-files -- '*.rs' | sort > tracked.txt
          jq -r '.paths.scanned[]' scan.json | grep '\.rs$' | sort > scanned.txt || true
          echo "tracked Rust files: $(wc -l < tracked.txt), scanned: $(wc -l < scanned.txt)"
          if ! diff -u tracked.txt scanned.txt; then
            echo "::error::the scan population is not the tracked Rust files" >&2
            exit 1
          fi
          exit "$status"
      # --disable-nosem reveals a suppressed finding; it does not fail merely
      # because the suppression text is there. This is what enforces the policy.
      - name: No inline suppressions
        run: |
          if grep -rInE 'nosem(grep)?' src tests validation fuzz; then
            echo "::error::inline suppression text is not allowed in this lane" >&2
            exit 1
          fi

  ci-passed:
    name: ci-passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - rustdoc
      - msrv
      - package
      - backend
      - consumer-matrix
      - fuzz-lint
      - fuzz
      - actionlint
      - zizmor
      - opengrep
    steps:
      # `needs.*.result` includes skipped and cancelled. Requiring every one to
      # be `success` is the only form that cannot pass on a job that never ran.
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed" >&2
              exit 1
            fi
          done
