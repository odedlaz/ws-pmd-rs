[package]
name = "permessage-deflate"
description = "RFC 7692 permessage-deflate negotiation and DEFLATE codec, independent of any WebSocket implementation"
categories = ["web-programming::websocket", "network-programming"]
keywords = ["websocket", "permessage-deflate", "rfc7692", "compression"]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

# The named backend arms are development-only and must not ship in the package;
# see validation/README.md.
exclude = ["validation"]

[dependencies]
http = "1"
thiserror = "2"

# 1.0.31 is the floor because it is the first release that *works*, not the
# first that offers `zlib-rs`. 1.0.29 and 1.0.30 both require
# `libz-rs-sys ^0.1.1`, and on a 0.x crate that caret admits only the 0.1 line,
# so there is no pin that avoids it at those two versions. That backend aborts
# the process rather than returning an error: a non-unwinding panic in
# `zlib-rs-0.1.1/src/inflate.rs:1602`, "read_buf is full", on a message long
# enough to refill this decoder's scratch buffer many times.
# `a_message_spanning_many_scratch_refills_decodes` is the row that reproduces
# it, so lowering this floor fails the suite rather than shipping.
[dependencies.flate2]
version = "1.0.31"
default-features = false
features = ["zlib-rs"]

# The decoder's tests drive it from an independent `flate2` peer rather than this
# crate's own encoder, so a shared mistake cannot pass as a round trip.
[dev-dependencies.flate2]
version = "1.0.31"
default-features = false
features = ["zlib-rs"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

# Two invocations, and neither replaces the other. `cargo clippy --locked` is
# the gate, and it sees production code only, which is what clippy checks by
# default. `cargo clippy --locked --all-targets` runs in addition, as a
# superset: it is what caught four `similar_names` in `tests/codec.rs` that the
# gate by itself cannot see.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Every fallible signature here names its error type, and NegotiationError's
# variants are documented one by one. A per-function restatement would drift.
missing_errors_doc = "allow"

# `const` on a public item is a semver commitment: adding it is backward
# compatible, taking it away later is breaking. Crate-internal items take this
# lint wherever it asks. A public item opts in by being written `const`
# deliberately, not by satisfying a lint at 0.1 that constrains internals which
# are not written yet.
missing_const_for_fn = "allow"

# Nothing in production may panic, index, or exit out of band. The four sites
# that would are each `#[expect]`-ed at the site with the invariant named and a
# test pinning it, so the allowance goes red if the invariant stops holding.
# Test modules opt out at the file or module level, where a panic is the
# reporting mechanism rather than a failure mode.
# `Decompress::reset` reinitialises at 15, so below that width it discards the
# negotiated window; see clippy.toml for the two routes and the measurement.
disallowed_methods = "deny"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
fallible_impl_from = "deny"
