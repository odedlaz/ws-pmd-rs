[package]
name = "ws-pmd-rs"
description = "RFC 7692 permessage-deflate negotiation and DEFLATE codec, independent of any WebSocket implementation"
repository = "https://github.com/odedlaz/ws-pmd-rs"
categories = ["web-programming::websocket", "network-programming"]
keywords = ["websocket", "permessage-deflate", "rfc7692", "compression"]
license = "MIT"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

# The named backend arms are development-only and must not ship in the package;
# see validation/README.md.
exclude = ["validation"]

# Activation requests, not exclusive guarantees. Cargo unions features across a
# graph, so naming one here cannot stop a dependent from also turning the other
# on -- what these buy is the ability for a host to switch the default *off* and
# choose. Selecting neither is legal when some other edge supplies a backend;
# flate2 raises its own `compile_error!` when none does, and duplicating that as
# an exactly-one guard would reject graphs that are valid.
[features]
default = ["zlib-rs"]
zlib-rs = ["flate2/zlib-rs"]
zlib = ["flate2/zlib"]

[dependencies]
http = "1"
thiserror = "2"

# 1.0.31 is the floor because it is the first release that *works*, not the
# first that offers `zlib-rs`. 1.0.29 and 1.0.30 both require
# `libz-rs-sys ^0.1.1`, and on a 0.x crate that caret admits only the 0.1 line,
# so there is no pin that avoids it at those two versions. That backend aborts
# the process rather than returning an error: a non-unwinding panic in
# `zlib-rs-0.1.1/src/inflate.rs:1602`, "read_buf is full", on a message long
# enough to refill this decoder's scratch buffer many times.
# `a_message_spanning_many_scratch_refills_decodes` is the row that reproduces
# it whenever that backend is the one resolved.
#
# That row does not defend this number, though. The locked gate resolves the
# `Cargo.lock` entry whatever the declared requirement says, so lowering the
# floor leaves the suite green. What excludes the aborting versions is this
# requirement itself, and only a resolver asked for minimum versions would
# exercise it -- a lane 0.1 does not carry.
[dependencies.flate2]
version = "1.0.31"
default-features = false

# The decoder's tests drive it from a `flate2` peer rather than this crate's own
# encoder, so a shared mistake cannot pass as a round trip. That peer is not
# independent of `flate2` itself; `tests/encoder.rs` states that limit on its
# `Verifier` and what does supply DEFLATE-layer independence.
#
# It names no backend on purpose. Asking for one here would satisfy `flate2`
# whatever the feature table above forwards, so a broken forward would still
# build and every test would still pass -- the suite would be proving the
# dev-dependency's request rather than the crate's public feature surface.
[dev-dependencies.flate2]
version = "1.0.31"
default-features = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

# Three invocations, and none replaces another. `cargo clippy --locked` is the
# gate, and it sees production code under the default features only.
# `--all-targets` is a superset over targets: it is what caught four
# `similar_names` in `tests/codec.rs` that the gate by itself cannot see.
# `--all-features` is a superset over features, and it became a distinct command
# the moment this manifest grew a `[features]` table -- before that it was the
# same run as the gate.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Every fallible signature here names its error type, and NegotiationError's
# variants are documented one by one. A per-function restatement would drift.
missing_errors_doc = "allow"

# `const` on a public item is a semver commitment: adding it is backward
# compatible, taking it away later is breaking. Crate-internal items take this
# lint wherever it asks. A public item opts in by being written `const`
# deliberately, not by satisfying a lint at 0.1 that constrains internals which
# are not written yet.
missing_const_for_fn = "allow"

# Nothing in production may panic, index, or exit out of band. Every site that
# would is `#[expect]`-ed at the site with the invariant named and a test pinning
# it, so the allowance goes red if the invariant stops holding. Deliberately not
# a count: a tally here goes stale the first time one is added or removed.
# Test modules opt out at the file or module level, where a panic is the
# reporting mechanism rather than a failure mode.
# `Decompress::reset` reinitialises at 15, so below that width it discards the
# negotiated window; see clippy.toml for the two routes and the measurement.
disallowed_methods = "deny"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
fallible_impl_from = "deny"
