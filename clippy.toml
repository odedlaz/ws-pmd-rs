# `Decompress::reset` takes no window bits, so it reinitialises at the backend
# default of 15 -- `inflateReset2(stream, ±MZ_DEFAULT_WINDOW_BITS)` on the C
# backend, `InflateConfig::default()` on zlib-rs. At any narrower width that
# silently discards the negotiated window; `InflaterConfig` records what the
# width buys on each backend. `InflaterConfig::reinitialise` picks the route
# that keeps it, and holds the one call this lint allows.
#
# What the lint buys, and what it does not: on the pinned zlib-rs backend no test
# catches an unconditional revert to `reset`, which is why it exists, but
# centralising the call is all it proves. Widening `reinitialise`'s condition to
# always-true goes through this allowed call, so route selection is unguarded
# rather than un-compilable. Both regressions are observable on a C-zlib build,
# by decode rather than by allocation -- and a test whose verdict inverts under
# feature unification is not a gate, which is why neither is guarded here.
disallowed-methods = [
    { path = "flate2::Decompress::reset", reason = "reinitialises at 15, discarding a narrower negotiated window; use InflaterConfig::reinitialise" },
]
