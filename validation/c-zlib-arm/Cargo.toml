# The C-zlib arm. It selects the backend the way a consumer does -- the library's
# default off, its `zlib` feature on -- so C zlib is the only backend in the
# graph and nothing has to win a dispatch. That is the change worth naming: while
# the arm took the default, `zlib-rs` was resolved alongside `libz-sys` and the
# arm ran on C only because `any_c_zlib` suppressed the Rust module. That
# suppression is a property of recent flate2; below 1.1.9 the precedence runs the
# other way, and the arm would have quietly become a second Rust arm while
# claiming to be the C one.
#
# `[workspace]` keeps this its own build. Building the two arms together would
# unify their features, and then only the dispatch rule would separate them.
[package]
name = "c-zlib-arm"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
permessage-deflate = { path = "../..", default-features = false, features = ["zlib"] }
http = "1"

[dependencies.flate2]
version = "1.0.31"
default-features = false
features = ["zlib"]
